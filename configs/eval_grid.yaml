# Frozen evaluation grid, schema v1.0
#
# Every gate number in this project is a cell in this grid or it is
# unfalsifiable. Cells whose eval data is not reachable are skipped and
# reported in run_meta.json.skipped_cells — never silently dropped.
#
# source: hf   -> pulled from Hugging Face datasets inside the notebook
# source: local -> read from evaldata/<file> (documented JSONL format in
#                  evaldata/README.md). Drop the human's private sets there.
#
# processor -> how a dataset's rows map to the laya `predict` interface
#              (typed_decisions | banking77 | xnli | sst5 | local)
schema_version: "1.0"
# r3: schema 1.0 + soft_acc_gold (mean probability mass on gold) so cells
# without gold teacher distributions (banking77 / sst5 / xnli) no longer have
# a blank soft-accuracy column. Teacher-matching soft_acc unchanged.
grid_tag: "v0-baseline-r3"

cells:
  # -- flagship: the four typed-decisions workflows, with gold + teacher
  #    distributions baked into the dataset (LocalLLaMA/typed-decisions) --
  - id: typed-decisions-core
    domain: typed-decisions
    split: id
    question_types: [choice, noul, score]
    models: [english, multilingual, typed_decisions, router]
    source: hf
    processor: typed_decisions
    dataset:
      hf: {repo: LocalLLaMA/typed-decisions, config: all, split: test}
    max_instances: 0

  # -- cardinality axis: 77-option intent classification (the Banking77
  #    72-vs-77 confound this project exists to fix). Note the *-server has no
  #    parquet for PolyAI/banking77 (script-only), so this uses the maintained
  #    legacy mirror with identical rows and the canonical label names. --
  - id: banking77-cardinality
    domain: banking
    split: id
    question_types: [choice]
    models: [english, multilingual, typed_decisions, router]
    source: hf
    processor: banking77
    dataset:
      hf: {repo: legacy-datasets/banking77, config: default, split: test}
    max_instances: 1000

  # -- ordinal rubric proxy: 5-class sentiment used to exercise the score
  #    primitive before the real 6-domain ordinal sets land in evaldata/ --
  - id: sst5-ordinal-proxy
    domain: sentiment
    split: id
    question_types: [score]
    models: [english, typed_decisions, router]
    source: hf
    processor: sst5
    dataset:
      hf: {repo: SetFit/sst5, split: test}
    max_instances: 1000

  # -- OOD / script stress: the non-Latin confident-wrong failure mode is the
  #    canonical escalate-gate target. Thai is the closest non-Latin script
  #    with public labeled data; true Khmer judgment comes from the local
  #    novelty cell once evaldata/novelty.jsonl lands --
  - id: xnli-en
    domain: nli
    split: id
    question_types: [choice]
    models: [english, multilingual, typed_decisions, router]
    source: hf
    processor: xnli
    dataset:
      hf: {repo: facebook/xnli, config: en, split: test}
    max_instances: 1000

  - id: xnli-thai-ood
    domain: nli
    split: novelty
    question_types: [choice]
    models: [english, multilingual, typed_decisions, router]
    source: hf
    processor: xnli
    dataset:
      hf: {repo: facebook/xnli, config: th, split: test}
    max_instances: 1000

